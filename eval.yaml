# Evaluation of the pipeline in rag.yaml. `rag-gate gate` fails when a metric breaks
# its threshold for the profile the results were produced with.
golden_set: eval/golden.yaml
metrics:
  - hit_rate           # deterministic: a retrieved chunk comes from an answering page
  - mrr                # deterministic: 1 / rank of the first such chunk
  - faithfulness       # RAGAS: answer claims supported by the retrieved context
  - answer_relevancy   # RAGAS: the answer addresses the question
  - context_precision  # RAGAS: relevant chunks are ranked first (uses the reference)
  - context_recall     # RAGAS: the context covers the reference answer
  - hallucination      # DeepEval 4.x HallucinationMetric: share of contexts the answer agrees with (higher is better)

profiles:
  local:
    generator_model: qwen3:8b
    judge_model: qwen3:8b
    # Optional, off when absent: unload the Ollama models after every N questions.
    # On a 16 GB machine the llama-server prompt cache otherwise grows to several GB
    # during a 30-question run (see README, Limitations).
    unload_every: 3
    thresholds: &thresholds
      hit_rate: {min: 0.80}
      mrr: {min: 0.60}
      faithfulness: {min: 0.70}
      answer_relevancy: {min: 0.60}
      context_precision: {min: 0.60}
      context_recall: {min: 0.70}
      hallucination: {min: 0.40}
  # The PR workflow and `make demo`: the first 8 golden questions, so a run fits a
  # GitHub-hosted CPU runner. The gate compares them with the same 8 baseline questions.
  ci:
    generator_model: qwen3:8b
    judge_model: qwen3:8b
    limit: 8
    thresholds: *thresholds
