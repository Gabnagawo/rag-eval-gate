[project]
name = "rag-eval-gate"
version = "0.1.0"
description = "A small RAG pipeline over public docs with a RAGAS + DeepEval quality gate for CI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Nagawo", email = "gabrielnagawo12@gmail.com" }]
keywords = ["rag", "llm", "evaluation", "ragas", "deepeval", "ollama", "ci", "quality-gate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "deepeval>=4.3,<5",
    "httpx>=0.27",
    "langchain-community>=0.4,<0.4.2",
    "langchain-core>=0.3",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "ragas>=0.4,<0.5",
    "typer>=0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[project.scripts]
rag-gate = "rag_eval_gate.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/Gabnagawo/rag-eval-gate"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_gate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# data/ holds upstream docs verbatim: ruff would reformat the Python blocks inside them.
extend-exclude = ["docs/results", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "C4", "PT", "RUF", "N", "PTH", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "S101", "S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not live",
    "--cov=rag_eval_gate",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]
markers = ["live: needs a running Ollama with qwen3:8b and nomic-embed-text (deselected by default)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["rag_eval_gate"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["ragas.*", "deepeval.*", "anthropic", "openai"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# The framework base classes are untyped (follow_imports=skip), so subclassing them is Any.
module = ["rag_eval_gate.judges"]
disallow_subclassing_any = false
